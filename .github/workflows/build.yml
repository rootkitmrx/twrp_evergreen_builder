name: Build TWRP for Evergreen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Free Disk Space
      - name: Maximize Disk Space
        run: |
          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo apt-get clean
          sudo docker system prune -af || true

          echo "Disk after cleanup:"
          df -h

      # Swap
      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      # Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git-core \
            python3 \
            python-is-python3 \
            build-essential \
            flex \
            bison \
            gperf \
            zlib1g-dev \
            liblz4-tool \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            xsltproc \
            unzip \
            wget \
            curl \
            bc \
            rsync \
            ccache \
            zip \
            libelf-dev \
            libtinfo5 \
            openjdk-11-jdk

      # Repo Tool
      - name: Install Repo Tool
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Git Configuration
      - name: Configure Git
        run: |
          git config --global user.name "Amil"
          git config --global user.email "amil@example.com"

          git config --global --add \
            url."https://github.com/".insteadOf "git@github.com:"

          git config --global --add \
            url."https://github.com/".insteadOf "ssh://git@github.com/"

          git config --global --add \
            url."https://github.com/".insteadOf "git://github.com/"

          git config --global --add \
            url."https://".insteadOf "git://"

          git config --global http.postBuffer 524288000

      # Initialize Repo
      - name: Initialize Repo
        run: |
          mkdir -p "$HOME/twrp"
          cd "$HOME/twrp"

          repo init \
            -u https://github.com/omnirom/android.git \
            -b android-12.1 \
            --depth=1 \
            --manifest-branch=android-12.1

      # Sync Sources
      - name: Sync Sources
        timeout-minutes: 180
        run: |
          cd "$HOME/twrp"

          export GIT_TERMINAL_PROMPT=0
          export PYTHONUNBUFFERED=1

          repo sync \
            -c \
            -j4 \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --fail-fast \
            -v

      # Clone Device Tree
      - name: Clone Device Tree
        run: |
          cd "$HOME/twrp"

          git clone \
            https://github.com/mmtrt/android_device_xiaomi_evergreen.git \
            -b twrp-12.1 \
            device/xiaomi/evergreen

      # Check Disk
      - name: Check Disk Space
        run: |
          echo "Disk:"
          df -h

          echo "Memory:"
          free -h

      # Build
      - name: Build Recovery
        run: |
          cd "$HOME/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch omni_evergreen-userdebug

          mka recoveryimage -j4

      # Upload Recovery
      - name: Upload Recovery Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evergreen
          path: /home/runner/twrp/out/target/product/evergreen/recovery.img
          if-no-files-found: error
          compression-level: 0

      # Upload Logs
      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-build-logs
          path: |
            /home/runner/twrp/out/error.log
          if-no-files-found: ignore

      # Final Disk Info
      - name: Disk Information
        if: always()
        run: |
          echo "Final disk usage:"
          df -h
