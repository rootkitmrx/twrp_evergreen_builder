name: Build TWRP for Evergreen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git python3 build-essential flex bison gperf zlib1g-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils xsltproc unzip wget bc rsync

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -s ~/bin/repo /usr/local/bin/repo

    - name: Initialize Repo and Sync TWRP 12.1
      run: |
        mkdir -p ~/twrp
        cd ~/twrp
        git config --global user.name "test"
        git config --global user.email "test@example.com"
        git config --global url."https://github.com/".insteadOf git@github.com:
        git config --global url."https://".insteadOf "git://"
        repo init -u https://github.com/omnirom/android.git -b android-12.1 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd ~/twrp
        git clone https://github.com/mmtrt/android_device_xiaomi_evergreen.git -b twrp-12.1 device/xiaomi/evergreen

    - name: Start Building Recovery
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch omni_evergreen-userdebug
        mka recoveryimage

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: recovery-evergreen
        path: ~/twrp/out/target/product/evergreen/recovery.img
