name: Build TWRP for Evergreen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # 1. Disk Cleanup
      - name: Maximize Disk Space
        run: |
          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo apt-get clean
          sudo docker system prune -af || true

          echo "Disk after cleanup:"
          df -h

      # 2. Build Directory
      - name: Select Build Directory
        run: |
          BUILD_DIR="$HOME/twrp"

          mkdir -p "$BUILD_DIR"

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

          echo "Selected directory: $BUILD_DIR"
          df -h "$BUILD_DIR"

      # 3. Swap
      - name: Setup Swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      # 4. Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python-is-python3 \
            build-essential \
            flex \
            bison \
            gperf \
            zlib1g-dev \
            liblz4-tool \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            xsltproc \
            unzip \
            wget \
            curl \
            bc \
            rsync \
            ccache \
            zip \
            libelf-dev \
            libtinfo5 \
            openjdk-11-jdk

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      # 5. Repo Tool
      - name: Install Repo Tool
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # 6. Git Configuration
      - name: Configure Git
        run: |
          git config --global user.name "Amil"
          git config --global user.email "amil@example.com"

          git config --global --add \
            url."https://github.com/".insteadOf "git@github.com:"

          git config --global --add \
            url."https://github.com/".insteadOf "ssh://git@github.com/"

          git config --global --add \
            url."https://github.com/".insteadOf "git://github.com/"

          git config --global http.postBuffer 524288000

      # 7. Initialize Repo
      - name: Initialize Repo
        run: |
          cd "$BUILD_DIR"

          repo init \
            -u https://github.com/omnirom/android.git \
            -b android-12.1 \
            --depth=1 \
            --manifest-branch=android-12.1

      # 8. Fix OmniROM Manifest
      - name: Fix OmniROM Manifest
        run: |
          cd "$BUILD_DIR"

          mkdir -p .repo/local_manifests

          BASE_URL="https://github.com/omnirom/android_frameworks_base_old.git"
          CORE_URL="https://github.com/omnirom/android_system_core_old.git"

          echo "Checking frameworks/base..."

          if ! git ls-remote --exit-code --heads \
            "$BASE_URL" refs/heads/android-12.1; then
            echo "::error::frameworks/base branch unavailable"
            exit 1
          fi

          echo "Checking system/core..."

          if ! git ls-remote --exit-code --heads \
            "$CORE_URL" refs/heads/android-12.1; then
            echo "::error::system/core branch unavailable"
            exit 1
          fi

          cat > .repo/local_manifests/omni-fixes.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>

              <remove-project name="android_frameworks_base" />

              <project
                  path="frameworks/base"
                  name="android_frameworks_base_old"
                  remote="omnirom"
                  revision="android-12.1" />

              <remove-project name="android_system_core" />

              <project
                  path="system/core"
                  name="android_system_core_old"
                  remote="omnirom"
                  revision="android-12.1" />

          </manifest>
          EOF

          echo "Base manifest fixes completed."

      # 9. Automatically Remove Optional Omni Applications
      - name: Remove Optional Omni Applications
        run: |
          cd "$BUILD_DIR"

          mkdir -p .repo/local_manifests

          repo manifest -o /tmp/full-manifest.xml

          python3 <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse("/tmp/full-manifest.xml")
          root = tree.getroot()

          projects = set()

          for project in root.iter("project"):
              name = project.get("name", "")

              if name.startswith("android_packages_apps_Omni"):
                  projects.add(name)

          manifest = ET.Element("manifest")

          for name in sorted(projects):
              ET.SubElement(
                  manifest,
                  "remove-project",
                  {"name": name}
              )

          ET.indent(manifest, space="    ")

          output = ".repo/local_manifests/remove-omni-apps.xml"

          ET.ElementTree(manifest).write(
              output,
              encoding="UTF-8",
              xml_declaration=True
          )

          print("\nRemoved optional Omni applications:")

          for name in sorted(projects):
              print(" -", name)

          print("\nTotal removed:", len(projects))
          PY

          echo "Optional Omni applications removed."

      # 10. Sync Sources
      - name: Sync Sources
        timeout-minutes: 180
        run: |
          cd "$BUILD_DIR"

          export GIT_TERMINAL_PROMPT=0
          export PYTHONUNBUFFERED=1

          repo sync \
            -c \
            -j4 \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --fail-fast \
            -v

      # 11. Clone Device Tree
      - name: Clone Device Tree
        run: |
          cd "$BUILD_DIR"

          git clone \
            https://github.com/mmtrt/android_device_xiaomi_evergreen.git \
            -b twrp-12.1 \
            device/xiaomi/evergreen

      # 12. Check Resources
      - name: Check Resources
        run: |
          echo "Disk:"
          df -h

          echo "Memory:"
          free -h

          echo "CPU:"
          nproc

      # 13. Build Recovery
      - name: Build Recovery
        run: |
          cd "$BUILD_DIR"

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"

          ccache -M 5G

          source build/envsetup.sh

          lunch omni_evergreen-userdebug

          mka recoveryimage -j4

      # 14. Verify Recovery
      - name: Verify Recovery
        if: success()
        run: |
          IMAGE="$BUILD_DIR/out/target/product/evergreen/recovery.img"

          if [ ! -f "$IMAGE" ]; then
            echo "::error::recovery.img not found!"
            exit 1
          fi

          echo "Recovery image:"
          ls -lh "$IMAGE"

          echo "SHA256:"
          sha256sum "$IMAGE"

      # 15. Upload Recovery
      - name: Upload Recovery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Evergreen
          path: ${{ env.BUILD_DIR }}/out/target/product/evergreen/recovery.img
          if-no-files-found: error
          compression-level: 0

      # 16. Upload Logs
      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Evergreen-Build-Logs
          path: |
            ${{ env.BUILD_DIR }}/out/error.log
            ${{ env.BUILD_DIR }}/out/verbose.log
          if-no-files-found: ignore

      # 17. Final Information
      - name: Final Disk Information
        if: always()
        run: |
          echo "Final disk:"
          df -h

          echo "Memory:"
          free -h

          echo "CCache:"
          ccache -s || true
